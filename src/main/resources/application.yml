spring:
  datasource:
    url: jdbc:mysql://bank-database:3306/bank?allowPublicKeyRetrieval=true&autoReconnect=true&useSSL=false
    username: username
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        #dialect: "org.hibernate.dialect.MySQL8Dialect"
        dialect: "org.hibernate.dialect.MySQLDialect"
      ddl-auto: update
    generate-ddl: true
    show-sql: true
  #data:
    #jpa:
      #repositories:
        #bootstrap-mode: deferred
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  batch:
    job:
      enabled: true
    jdbc:
      initialize-schema: always
  mail:
    host: mailpit
    port: 1025
    properties:
      mail:
        username: username
        password: password
        smtp:
          auth: false
          starttls:
            enable: false
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always